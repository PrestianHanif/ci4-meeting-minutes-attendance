<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="160" height="160">
  <defs>
    <path id="circlePathTop" d="M 25,100 A 75,75 0 0,1 175,100" />
    <path id="circlePathBottom" d="M 175,100 A 75,75 0 0,1 25,100" />
  </defs>
  
  <!-- Outer double ring -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#1E40AF" stroke-width="3" opacity="0.85"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#1E40AF" stroke-width="1.2" opacity="0.85"/>
  
  <!-- Inner ring -->
  <circle cx="100" cy="100" r="62" fill="none" stroke="#1E40AF" stroke-width="1.5" opacity="0.85"/>

  <!-- Top Circular Text -->
  <text font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold" fill="#1E40AF" opacity="0.9" letter-spacing="1.2">
    <textPath href="#circlePathTop" startOffset="50%" text-anchor="middle">
      UNIVERSITAS ISLAM INDONESIA
    </textPath>
  </text>

  <!-- Bottom Circular Text -->
  <text font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold" fill="#1E40AF" opacity="0.9" letter-spacing="1">
    <textPath href="#circlePathBottom" startOffset="50%" text-anchor="middle">
      FAKULTAS ILMU AGAMA ISLAM
    </textPath>
  </text>

  <!-- Stars separator -->
  <polygon points="22,100 24,96 28,96 25,93 26,89 22,91 18,89 19,93 16,96 20,96" fill="#1E40AF" opacity="0.85"/>
  <polygon points="178,100 180,96 184,96 181,93 182,89 178,91 174,89 175,93 172,96 176,96" fill="#1E40AF" opacity="0.85"/>

  <!-- Center Emblem -->
  <g transform="translate(100, 100) scale(0.65)" opacity="0.9">
    <!-- Mini emblem crest -->
    <path d="M 0,-35 L 28,-10 L 22,25 L 0,35 L -22,25 L -28,-10 Z" fill="none" stroke="#1E40AF" stroke-width="2.5"/>
    <text x="0" y="-8" font-family="'Noto Serif', serif" font-size="12" font-weight="bold" fill="#1E40AF" text-anchor="middle">FIAI</text>
    <text x="0" y="8" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="bold" fill="#1E40AF" text-anchor="middle">DEKANAT</text>
    <line x1="-15" y1="14" x2="15" y2="14" stroke="#1E40AF" stroke-width="1"/>
    <text x="0" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" fill="#1E40AF" text-anchor="middle">YOGYAKARTA</text>
  </g>
</svg>
